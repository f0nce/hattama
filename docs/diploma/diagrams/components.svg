<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#52739d"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#152d4d} .label{font-size:17px} .small{font-size:14px;fill:#60796f}</style><text x="35" y="45" font-size="25" font-weight="bold">Hattama: implemented components</text><rect x="40" y="230" width="1120" height="700" rx="0" fill="#f4f7fc" stroke="#a3b5aa" stroke-width="1.5" stroke-dasharray="6 5"/><text x="55" y="258" text-anchor="start" class="label">Backend and model processes</text><polyline points="600.0,180 600.0,285" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="805" y="215" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">HTTP + status polling</text><polyline points="460,380 460,430 270,430 270,485" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="275" y="415" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Metadata / review</text><polyline points="740,380 740,430 930,430 930,485" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="925" y="415" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Upload / export</text><polyline points="270.0,575 270.0,690" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="350" y="640" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Queued job</text><polyline points="440,735.0 650,740.0" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="545" y="725" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Run stages</text><polyline points="930.0,575 875.0,680" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="980" y="635" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Audio</text><polyline points="875.0,800 875.0,845" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><polyline points="650,875 490,875 490,530 440,530" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="560" y="945" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Persist result / state</text><rect x="420" y="95" width="360" height="85" rx="9" fill="#fff" stroke="#52739d" stroke-width="1.5" /><text x="600.0" y="132.5" text-anchor="middle" class="label">React / Vite / TypeScript</text><text x="600.0" y="155.5" text-anchor="middle" class="label">Local browser</text><rect x="365" y="285" width="470" height="95" rx="9" fill="#e8f0fc" stroke="#52739d" stroke-width="1.5" /><text x="600.0" y="327.5" text-anchor="middle" class="label">FastAPI API</text><text x="600.0" y="350.5" text-anchor="middle" class="label">Upload, status, review, export</text><rect x="100" y="485" width="340" height="90" rx="9" fill="#fff" stroke="#52739d" stroke-width="1.5" /><text x="270.0" y="525.0" text-anchor="middle" class="label">SQLite WAL</text><text x="270.0" y="548.0" text-anchor="middle" class="label">Meetings, jobs, result JSON</text><rect x="760" y="485" width="340" height="90" rx="9" fill="#fff" stroke="#52739d" stroke-width="1.5" /><text x="930.0" y="525.0" text-anchor="middle" class="label">Local files</text><text x="930.0" y="548.0" text-anchor="middle" class="label">Audio and DOCX export</text><rect x="100" y="690" width="340" height="90" rx="9" fill="#fff" stroke="#52739d" stroke-width="1.5" /><text x="270.0" y="730.0" text-anchor="middle" class="label">Single Python worker</text><text x="270.0" y="753.0" text-anchor="middle" class="label">Claim persisted queued job</text><rect x="650" y="680" width="450" height="120" rx="9" fill="#fff" stroke="#52739d" stroke-width="1.5" /><text x="875.0" y="724.0" text-anchor="middle" class="label">Child-process model stages</text><text x="875.0" y="747.0" text-anchor="middle" class="label">Mixed-CTC ASR / sherpa ONNX</text><text x="875.0" y="770.0" text-anchor="middle" class="label">4-bit Qwen3-4B generation</text><rect x="650" y="845" width="450" height="60" rx="9" fill="#fff" stroke="#52739d" stroke-width="1.5" /><text x="875.0" y="881.0" text-anchor="middle" class="label">Validate structured minutes</text><text x="35" y="1035" class="small">Mac uses MLX; the Windows adapter uses PyTorch. Model stages execute locally.</text><text x="35" y="1055" class="small">No Redis, Celery, PostgreSQL, live provider or shared authentication in this baseline.</text></svg>