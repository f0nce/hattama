<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#52739d"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#152d4d} .label{font-size:17px} .small{font-size:14px;fill:#60796f}</style><text x="35" y="45" font-size="25" font-weight="bold">Hattama: processing and saved review</text><polyline points="280,200.0 480,200.0" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="380" y="185" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Worker claims</text><polyline points="710,200.0 900,200.0" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="800" y="185" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Valid result</text><polyline points="595.0,240 595.0,385" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="605" y="325" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Error / interrupted job</text><polyline points="480,425 165,425 165,240" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="315" y="410" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Explicit retry</text><polyline points="1015.0,240 1015.0,385" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><polyline points="1015,480 1015,560 595,560 595,620" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="805" y="545" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Human review</text><polyline points="710,670.0 900,670.0" fill="none" stroke="#52739d" stroke-width="1.6" marker-end="url(#arrow)" /><text x="805" y="700" class="small" text-anchor="middle" style="paint-order:stroke;stroke:white;stroke-width:5px">Saved version</text><rect x="50" y="160" width="230" height="80" rx="9" fill="#fff" stroke="#52739d" stroke-width="1.5" /><text x="165.0" y="206.0" text-anchor="middle" class="label">Queued</text><rect x="480" y="160" width="230" height="80" rx="9" fill="#fff" stroke="#52739d" stroke-width="1.5" /><text x="595.0" y="206.0" text-anchor="middle" class="label">Processing</text><rect x="900" y="160" width="230" height="80" rx="9" fill="#e8f0fc" stroke="#52739d" stroke-width="1.5" /><text x="1015.0" y="206.0" text-anchor="middle" class="label">Done</text><rect x="480" y="385" width="230" height="80" rx="9" fill="#fff" stroke="#52739d" stroke-width="1.5" /><text x="595.0" y="431.0" text-anchor="middle" class="label">Failed</text><rect x="900" y="385" width="230" height="95" rx="9" fill="#fff" stroke="#52739d" stroke-width="1.5" /><text x="1015.0" y="427.5" text-anchor="middle" class="label">Immutable original</text><text x="1015.0" y="450.5" text-anchor="middle" class="label">+ latest review JSON</text><rect x="480" y="620" width="230" height="100" rx="9" fill="#fff" stroke="#52739d" stroke-width="1.5" /><text x="595.0" y="665.0" text-anchor="middle" class="label">Save corrections</text><text x="595.0" y="688.0" text-anchor="middle" class="label">expected_revision</text><rect x="900" y="620" width="230" height="100" rx="9" fill="#fff" stroke="#52739d" stroke-width="1.5" /><text x="1015.0" y="665.0" text-anchor="middle" class="label">Export DOCX</text><text x="1015.0" y="688.0" text-anchor="middle" class="label">from saved revision</text><text x="35" y="805" class="small">A stale expected_revision returns HTTP 409; there is no formal approval state or full version history.</text><text x="35" y="825" class="small">Deletion is available only outside processing; the UI blocks export while edits are unsaved.</text></svg>